backend:
  name: turbo-github
  repo: "SottoMonte/cartaway"
  turbo_site_id: "ff79a9ad-41d1-4a67-8952-45c2fde97f13"
  branch: main

locale: it
publish_mode: simple
media_folder: uploads
public_folder: /uploads

collections:
  - name: impostazioni
    label: Impostazioni sito
    files:
      - name: azienda
        label: Azienda e contatti
        file: data/site.json
        fields:
          - { label: Nome attività, name: brand, widget: string }
          - { label: Città o zona, name: city, widget: string }
          - { label: Frase introduttiva, name: tagline, widget: string }
          - { label: Attività offerte, name: services, widget: string, required: false }
          - { label: Descrizione dei servizi, name: service_note, widget: string, required: false }
          - { label: Nota sulle consegne, name: delivery_note, widget: string, required: false }
          - label: Zone di consegna
            name: delivery_zones
            widget: list
            required: false
            label_singular: zona
            fields:
              - { label: ID zona, name: id, widget: string }
              - { label: Nome zona, name: name, widget: string }
              - { label: Tempo di consegna, name: delivery_time, widget: string }
              - label: Modalità costo consegna
                name: delivery_policy
                widget: select
                options:
                  - { label: Gratuita senza soglia, value: free }
                  - { label: Gratuita da una soglia, value: threshold }
                  - { label: A pagamento, value: paid }
              - { label: Importo minimo ordine (euro), name: minimum_order_amount, widget: number, value_type: float, min: 0, step: 0.01, required: false }
              - { label: Soglia consegna gratuita (euro), name: free_delivery_minimum, widget: number, value_type: float, min: 0, step: 0.01, required: false }
              - { label: Costo consegna (euro), name: delivery_fee, widget: number, value_type: float, min: 0, step: 0.01, required: false }
              - label: Località sulla mappa
                name: locations
                widget: list
                label_singular: località
                fields:
                  - { label: Comune, name: name, widget: string }
                  - { label: Latitudine, name: lat, widget: number, value_type: float, step: 0.0000001 }
                  - { label: Longitudine, name: lon, widget: number, value_type: float, step: 0.0000001 }
          - label: Buono Tech
            name: tech_voucher
            widget: object
            fields:
              - { label: Percentuale Buono Tech non ricorrente, name: percent, widget: number, value_type: float, min: 0, max: 100, step: 0.1 }
              - { label: Importo massimo (euro), name: maximum_amount, widget: number, value_type: float, min: 0, step: 0.01 }
              - { label: Durata dalla consegna (giorni), name: validity_days, widget: number, value_type: int, min: 1, step: 1 }
          - label: Ordine ricorrente
            name: recurring_order
            widget: object
            fields:
              - { label: Sconto percentuale, name: discount_percent, widget: number, value_type: float, min: 0, max: 100, step: 0.1 }
              - { label: Percentuale Buono Tech ricorrente, name: tech_voucher_percent, widget: number, value_type: float, min: 0, max: 100, step: 0.1 }
              - { label: Mesi di prezzo bloccato, name: price_lock_months, widget: number, value_type: int, min: 1, step: 1 }
              - label: Cadenze degli ordini ricorrenti
                name: frequency_days
                widget: list
                label_singular: cadenza
                fields:
                  - { label: Intervallo (giorni), name: days, widget: number, value_type: int, min: 1, step: 1 }
                  - { label: Testo mostrato, name: label, widget: string, hint: "Etichetta completa, ad esempio: Ogni settimana, Ogni 15 giorni o Ogni mese." }
              - { label: Durata Buono Tech con ordine ricorrente (giorni), name: tech_voucher_validity_days, widget: number, value_type: int, min: 1, step: 1 }
              - { label: Giorno fisso di consegna, name: fixed_delivery_day, widget: boolean, default: true }
          - label: Messaggi rapidi
            name: quick_messages
            widget: object
            fields:
              - label: Buono Tech
                name: tech
                widget: object
                fields:
                  - { label: Testo nella barra, name: banner_message, widget: string, hint: "Scrivi il beneficio per il cliente. Segnaposto: {maximum_amount}." }
                  - { label: Eyebrow del modale, name: eyebrow, widget: string }
                  - { label: Titolo del modale, name: title, widget: string }
                  - { label: Descrizione, name: description, widget: text, hint: "Segnaposto: {standard_percent}, {recurring_percent}, {maximum_amount}." }
                  - { label: Etichetta esempio ordine singolo, name: standard_example_label, widget: string }
                  - { label: Testo esempio ordine singolo, name: standard_example_result, widget: string, hint: "Segnaposto: {standard_example_amount}, {maximum_amount}." }
                  - { label: Etichetta esempio ordine ricorrente, name: recurring_example_label, widget: string }
                  - { label: Testo esempio ordine ricorrente, name: recurring_example_result, widget: string, hint: "Segnaposto: {recurring_example_amount}, {maximum_amount}." }
                  - { label: Condizioni, name: terms, widget: text, hint: "Segnaposto: {validity_days}, {recurring_validity_days}, {link}." }
                  - { label: Testo del link, name: link_label, widget: string }
                  - { label: URL del link, name: link_url, widget: string, hint: Inserisci un indirizzo HTTPS o del sito. }
              - label: Ordine ricorrente
                name: recurring
                widget: object
                fields:
                  - { label: Testo nella barra, name: banner_message, widget: string, hint: "L'emoji 🏷️ fa parte del testo e si modifica qui. Segnaposto: {discount_percent}, {price_lock_months}, {recurring_validity_days}." }
                  - { label: Eyebrow del modale, name: eyebrow, widget: string }
                  - { label: Titolo del modale, name: title, widget: string }
                  - { label: Descrizione, name: description, widget: text, hint: "Segnaposto: {frequency_days}, {discount_percent}, {price_lock_months}." }
                  - { label: Etichetta dello sconto, name: discount_label, widget: string }
                  - { label: Testo dello sconto, name: discount_value, widget: string, hint: "Segnaposto: {discount_percent}." }
                  - { label: Etichetta del prezzo bloccato, name: price_lock_label, widget: string }
                  - { label: Testo del prezzo bloccato, name: price_lock_value, widget: string, hint: "Segnaposto: {price_lock_months}." }
                  - { label: Etichetta delle frequenze, name: frequency_label, widget: string }
                  - { label: Testo delle frequenze, name: frequency_value, widget: string, hint: "Segnaposto: {frequency_days}." }
                  - { label: Etichetta del Buono Tech, name: tech_voucher_label, widget: string }
                  - { label: Testo del Buono Tech, name: tech_voucher_value, widget: string, hint: "Segnaposto: {tech_voucher_recurring_percent}, {maximum_amount}, {recurring_validity_days}." }
                  - { label: Condizioni, name: terms, widget: text, hint: "Segnaposto: {recurring_validity_days}." }
          - { label: Indirizzo pubblico, name: address, widget: string, required: false }
          - { label: Telefono, name: phone, widget: string, required: false }
          - label: Numero WhatsApp
            name: whatsapp
            widget: string
            required: false
            hint: Inserisci il numero completo con prefisso internazionale, solo cifre.
          - { label: Email di contatto, name: email, widget: string, required: false }
          - label: Invio ordini EmailJS
            name: emailjs
            widget: object
            fields:
              - { label: Public Key, name: public_key, widget: string, required: false, hint: Identificativo pubblico EmailJS; il destinatario va configurato nel template EmailJS. }
              - { label: Service ID, name: service_id, widget: string, required: false }
              - { label: Template ID per il riepilogo cliente, name: template_id, widget: string, required: false }
          - label: Dati dell'impresa
            name: legal
            widget: object
            fields:
              - { label: Titolare o denominazione, name: holder, widget: string, required: false }
              - { label: Forma giuridica, name: legal_form, widget: string, required: false }
              - { label: Sede legale, name: registered_office, widget: string, required: false }
              - { label: Partita IVA, name: vat_number, widget: string, required: false }
              - { label: Numero REA, name: rea, widget: string, required: false }
          - { label: Prezzi comprensivi di IVA, name: prices_include_vat, widget: boolean, default: true }
          - label: Attività e profili prodotto
            name: profiles
            widget: list
            label_singular: attività
            fields:
              - { label: ID usato nei prodotti, name: value, widget: string }
              - { label: Nome visualizzato, name: label, widget: string }
          - label: Categorie e aliquote IVA
            name: categories
            widget: list
            label_singular: categoria
            fields:
              - { label: Nome categoria, name: name, widget: string }
              - { label: Aliquota IVA (%), name: vat_rate, widget: number, value_type: float, min: 0, max: 100, step: 0.1, required: false, hint: "Lascia vuoto finché l'aliquota non è stata verificata." }
              - label: Sottocategorie
                name: children
                widget: list
                required: false
                label_singular: sottocategoria
                fields:
                  - { label: Nome sottocategoria, name: name, widget: string }
                  - { label: Aliquota IVA (%), name: vat_rate, widget: number, value_type: float, min: 0, max: 100, step: 0.1, required: false, hint: "Lascia vuoto finché l'aliquota non è stata verificata." }

  - name: catalogo
    label: Catalogo prodotti
    files:
      - name: prodotti
        label: Prodotti
        file: data/products.json
        fields:
          - label: Prodotti
            name: products
            widget: list
            label_singular: prodotto
            fields:
              - label: ID univoco
                name: id
                widget: string
                hint: Breve, univoco e senza spazi; per esempio carta-igienica-12-rotoli.
              - { label: Nome prodotto, name: name, widget: string }
              - label: Profili attività
                name: profiles
                widget: list
                required: false
                label_singular: profilo
                field:
                  label: Attività
                  name: profile
                  widget: profile-select
              - label: Categorie
                name: category
                widget: category-list
                hint: Seleziona una categoria e, se presente, la sottocategoria.
                  - Cucina
              - label: Unità di vendita
                name: unit
                widget: object
                fields:
                  - { label: Quantità, name: quantity, widget: number, value_type: int, min: 1, required: true }
                  - { label: Unità di misura, name: measure, widget: string, required: true }
                  - { label: Dettagli formato, name: details, widget: string, required: false }
                  - { label: Prezzo per unità, name: pricePer, widget: string, required: true }
              - label: Prezzo in euro
                name: price
                widget: number
                value_type: float
                min: 0
                step: 0.01
              - { label: Descrizione, name: description, widget: text, required: false }
              - { label: Foto prodotto, name: image, widget: image, required: false }
              - label: Foto aggiuntive
                name: images
                widget: list
                required: false
                field: { label: Foto, name: image, widget: image }
              - label: Caratteristiche
                name: specifications
                widget: list
                required: false
                label_singular: caratteristica
                fields:
                  - { label: Nome caratteristica, name: label, widget: string }
                  - { label: Valore, name: value, widget: string }
              - { label: In evidenza, name: featured, widget: boolean, default: false }
              - { label: Disponibile, name: available, widget: boolean, default: true }
