backend:
  name: turbo-github
  repo: "SottoMonte/cartaway"
  turbo_site_id: "ff79a9ad-41d1-4a67-8952-45c2fde97f13"
  branch: main

locale: it
publish_mode: simple
media_folder: uploads
public_folder: /uploads

collections:
  - name: impostazioni
    label: Impostazioni sito
    files:
      - name: azienda
        label: Azienda e contatti
        file: data/site.json
        fields:
          - { label: Nome attività, name: brand, widget: string }
          - { label: Città o zona, name: city, widget: string }
          - { label: Frase introduttiva, name: tagline, widget: string }
          - { label: Attività offerte, name: services, widget: string, required: false }
          - { label: Descrizione dei servizi, name: service_note, widget: string, required: false }
          - { label: Nota sulle consegne, name: delivery_note, widget: string, required: false }
          - label: Zone di consegna
            name: delivery_zones
            widget: list
            required: false
            label_singular: zona
            fields:
              - { label: ID zona, name: id, widget: string }
              - { label: Nome zona, name: name, widget: string }
              - { label: Tempo di consegna, name: delivery_time, widget: string }
              - label: Modalità costo consegna
                name: delivery_policy
                widget: select
                options:
                  - { label: Gratuita senza soglia, value: free }
                  - { label: Gratuita da una soglia, value: threshold }
                  - { label: A pagamento, value: paid }
              - { label: Importo minimo ordine (euro), name: minimum_order_amount, widget: number, value_type: float, min: 0, step: 0.01, required: false }
              - { label: Soglia consegna gratuita (euro), name: free_delivery_minimum, widget: number, value_type: float, min: 0, step: 0.01, required: false }
              - { label: Costo consegna (euro), name: delivery_fee, widget: number, value_type: float, min: 0, step: 0.01, required: false }
              - label: Località sulla mappa
                name: locations
                widget: list
                label_singular: località
                fields:
                  - { label: Comune, name: name, widget: string }
                  - { label: Latitudine, name: lat, widget: number, value_type: float, step: 0.0000001 }
                  - { label: Longitudine, name: lon, widget: number, value_type: float, step: 0.0000001 }
          - label: Buono Tech
            name: tech_voucher
            widget: object
            fields:
              - { label: Percentuale Buono Tech non ricorrente, name: percent, widget: number, value_type: float, min: 0, max: 100, step: 0.1 }
              - { label: Importo massimo (euro), name: maximum_amount, widget: number, value_type: float, min: 0, step: 0.01 }
              - { label: Durata dalla consegna (giorni), name: validity_days, widget: number, value_type: int, min: 1, step: 1 }
          - label: Ordine ricorrente
            name: recurring_order
            widget: object
            fields:
              - { label: Sconto percentuale, name: discount_percent, widget: number, value_type: float, min: 0, max: 100, step: 0.1 }
              - { label: Percentuale Buono Tech ricorrente, name: tech_voucher_percent, widget: number, value_type: float, min: 0, max: 100, step: 0.1 }
              - { label: Mesi di prezzo bloccato, name: price_lock_months, widget: number, value_type: int, min: 1, step: 1 }
              - label: Frequenze disponibili in giorni
                name: frequency_days
                widget: list
                field: { label: Giorni, name: days, widget: number, value_type: int, min: 1, step: 1 }
              - { label: Durata Buono Tech con ordine ricorrente (giorni), name: tech_voucher_validity_days, widget: number, value_type: int, min: 1, step: 1 }
              - { label: Giorno fisso di consegna, name: fixed_delivery_day, widget: boolean, default: true }
          - { label: Indirizzo pubblico, name: address, widget: string, required: false }
          - { label: Telefono, name: phone, widget: string, required: false }
          - label: Numero WhatsApp
            name: whatsapp
            widget: string
            required: false
            hint: Inserisci il numero completo con prefisso internazionale, solo cifre.
          - { label: Email di contatto, name: email, widget: string, required: false }
          - label: Invio ordini EmailJS
            name: emailjs
            widget: object
            fields:
              - { label: Public Key, name: public_key, widget: string, required: false, hint: Identificativo pubblico EmailJS; il destinatario va configurato nel template EmailJS. }
              - { label: Service ID, name: service_id, widget: string, required: false }
              - { label: Template ID per il riepilogo cliente, name: template_id, widget: string, required: false }
          - label: Dati dell'impresa
            name: legal
            widget: object
            fields:
              - { label: Titolare o denominazione, name: holder, widget: string, required: false }
              - { label: Forma giuridica, name: legal_form, widget: string, required: false }
              - { label: Sede legale, name: registered_office, widget: string, required: false }
              - { label: Partita IVA, name: vat_number, widget: string, required: false }
              - { label: Numero REA, name: rea, widget: string, required: false }

  - name: catalogo
    label: Catalogo prodotti
    files:
      - name: prodotti
        label: Prodotti
        file: data/products.json
        fields:
          - label: Prodotti
            name: products
            widget: list
            label_singular: prodotto
            fields:
              - label: ID univoco
                name: id
                widget: string
                hint: Breve, univoco e senza spazi; per esempio carta-igienica-12-rotoli.
              - { label: Nome prodotto, name: name, widget: string }
              - label: Categoria
                name: category
                widget: select
                options:
                  - Avvolgenti Alimentari
                  - Avvolgenti Alimentari / Carta e Veline alimentari
                  - Avvolgenti Alimentari / Carta sovrainvolto
                  - Avvolgenti Alimentari / Ideabrill
                  - Avvolgenti Alimentari / Rotoli pellicola, alluminio e carta forno
                  - Avvolgenti Alimentari / Sacchetti di carta
                  - Avvolgenti Alimentari / Sacchetti in plastica per alimenti
                  - Avvolgenti Alimentari / Sacchetti sottovuoto
                  - Avvolgenti Alimentari / Shoppers Bio-compostabili
                  - Avvolgenti Alimentari / Shoppers in carta
                  - Cancelleria e Ufficio
                  - Cancelleria e Ufficio / Accessori
                  - Cancelleria e Ufficio / Blocchi e fogli A4
                  - Cancelleria e Ufficio / Rotoli per cassa
                  - Cancelleria e Ufficio / Rotoli termici adesivi
                  - Contenitori cibo asporto
                  - Contenitori cibo asporto / Box fritti e panino
                  - Contenitori cibo asporto / Box pizza e Teglie in cartone
                  - Contenitori cibo asporto / Contenitori alluminio con coperchio bordo G
                  - Contenitori cibo asporto / Contenitori alluminio con coperchio bordo L
                  - Contenitori cibo asporto / Contenitori Bio-Compostabili
                  - Contenitori cibo asporto / Contenitori fast food con coperchio
                  - Contenitori cibo asporto / Contenitori in plastica con coperchio
                  - Contenitori cibo asporto / Contenitori laccati con coperchio
                  - Dispenser
                  - Dispositivi di sicurezza
                  - Dispositivi di sicurezza / Guanti
                  - Dispositivi di sicurezza / Scarpe da lavoro
                  - Igiene e Pulizia
                  - Igiene e Pulizia / Detergenti stoviglie
                  - Igiene e Pulizia / Detergenti superfici
                  - Igiene e Pulizia / Materiale per la pulizia
                  - Igiene e Pulizia / Sacchi spazzatura
                  - Igiene e Pulizia / Sapone mani
                  - Imballaggi
                  - Imballaggi / Carta gommata
                  - Imballaggi / Estensibile
                  - Imballaggi / Nastri adesivi
                  - Insetticida
                  - Itissue - Monouso in carta
                  - Itissue - Monouso in carta / Asciugamani piegati
                  - Itissue - Monouso in carta / Carta igienica
                  - Itissue - Monouso in carta / EcoNatural
                  - Itissue - Monouso in carta / Lenzuolino medico
                  - Itissue - Monouso in carta / Mini jumbo
                  - Itissue - Monouso in carta / Rotoloni
                  - Itissue - Monouso in carta / Tovaglioli
                  - Pasticceria e Gelateria
                  - Pasticceria e Gelateria / Basi e Accessori
                  - Pasticceria e Gelateria / Porta torte
                  - Pasticceria e Gelateria / Vaschette EPS gelato
                  - Pasticceria e Gelateria / Vassoi in cartone
                  - Stoviglie monouso
                  - Stoviglie monouso / Accessori monouso
                  - Stoviglie monouso / Bicchieri in cartoncino con coperchio
                  - Stoviglie monouso / Bicchieri in plastica con coperchio
                  - Stoviglie monouso / Cannucce e Agitatori
                  - Stoviglie monouso / Piatti e Scodelle
                  - Stoviglie monouso / Posate e Kit posate
                  - Tovaglie e Tovaglioli
                  - Tovaglie e Tovaglioli / Porta posate
                  - Tovaglie e Tovaglioli / Tovaglia TNT
                  - Tovaglie e Tovaglioli / Tovaglietta
                  - Tovaglie e Tovaglioli / Tovaglioli colorati
                  - Cucina
              - label: Unità di vendita
                name: unit
                widget: object
                fields:
                  - { label: Quantità, name: quantity, widget: number, value_type: int, min: 1, required: true }
                  - { label: Unità di misura, name: measure, widget: string, required: true }
                  - { label: Dettagli formato, name: details, widget: string, required: false }
                  - { label: Prezzo per unità, name: pricePer, widget: string, required: true }
              - label: Prezzo in euro
                name: price
                widget: number
                value_type: float
                min: 0
                step: 0.01
              - { label: Descrizione, name: description, widget: text, required: false }
              - { label: Foto prodotto, name: image, widget: image, required: false }
              - label: Foto aggiuntive
                name: images
                widget: list
                required: false
                field: { label: Foto, name: image, widget: image }
              - label: Caratteristiche
                name: specifications
                widget: list
                required: false
                label_singular: caratteristica
                fields:
                  - { label: Nome caratteristica, name: label, widget: string }
                  - { label: Valore, name: value, widget: string }
              - { label: In evidenza, name: featured, widget: boolean, default: false }
              - { label: Disponibile, name: available, widget: boolean, default: true }
